# Tests the home-box package (home/). Nothing is deployed from here: the home box pulls
# its own checkout. Runs on PRs and on main so the contract tests in home/tests/test_protocol.py
# gate any change to the Render side that touches the shared schema.
name: home tests

on:
  push:
    branches: [main]
    paths: ["home/**", ".github/workflows/home-tests.yml"]
  pull_request:
    paths: ["home/**", ".github/workflows/home-tests.yml"]
  workflow_dispatch:

jobs:
  test:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: pip install -e 'home[dev]'
      - run: python -m pytest home/tests -q
