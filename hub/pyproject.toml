[project]
name = "puntmore-hub"
version = "0.1.0"
description = "Puntmore's Hub: the Scraper's drop files and the tipster mailbox, HubAI's escalations and Finder posts, the placement engine, the Console"
requires-python = ">=3.11"
dependencies = [
    "pyyaml>=6",
]

[project.optional-dependencies]
# The Hub Console (`puntmore web`).
web = ["fastapi>=0.115", "uvicorn>=0.30"]
dev = ["pytest>=8", "jsonschema>=4.20", "httpx>=0.27"]

[project.scripts]
puntmore = "puntmore_hub.cli:main"

[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[tool.setuptools.packages.find]
include = ["puntmore_hub*"]

[tool.setuptools.package-data]
"puntmore_hub.web" = ["static/*"]

[tool.pytest.ini_options]
testpaths = ["tests"]
