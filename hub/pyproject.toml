[project]
name = "puntmore-hub"
version = "0.1.0"
description = "Hub side of Puntmore: scraper worker, Render link, placement client engine, local-AI escalation"
requires-python = ">=3.11"
dependencies = [
    "websockets>=12",
    "pyyaml>=6",
    "playwright>=1.45",
]

[project.optional-dependencies]
dev = ["pytest>=8", "jsonschema>=4.20"]

[project.scripts]
puntmore = "puntmore_hub.cli:main"

[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[tool.setuptools.packages.find]
include = ["puntmore_hub*"]

[tool.pytest.ini_options]
testpaths = ["tests"]
