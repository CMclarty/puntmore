# Copy to <name>.yaml. Files starting with _ are ignored.
# Adding a source = this file + parsers/<parser>.py + a fixture under fixtures/<parser>/. No other code changes.
name: example-site-market          # unique; also the source_id on every tip it emits
enabled: false                      # flip to true when the parser passes `puntmore parser-test`
kind: page                          # page (headful Chrome) | json (captured XHR) | email (tipster mailbox)
url: https://example.com/markets
parser: example_site_market         # parsers/<parser>.py exposing parse(fetched, source) -> list[dict]
market: match_odds                  # label only; the parser sets the market on each tip
schedule:
  every: 3h                         # or:  at: ["09:00", "17:00"]   (local time, Europe/London)
  # kickoff_window: 3h              # reserved: sweep every 30 min within this window before kick-off
wait_selector: ".market-list"       # CSS selector to wait for before reading the page (optional)
capture_json: []                    # URL substrings of XHR responses to capture alongside the HTML
trust_weight: 1.0                   # feeds Render's per-source weighting; lower for unproven sources
health:
  min_items: 5                      # fewer valid items than this = suspected layout change -> unhealthy + escalate
  price_min: 1.01
  price_max: 1000
notes: >
  Known quirks, last breakage and what fixed it. Agents: keep this current.
