services:
  api:
    # api/Dockerfile is a single image that also builds the frontend, so it
    # copies both api/ and frontend/ — it must build from the REPO ROOT, not
    # ./api (see the header comment in api/Dockerfile).
    build:
      context: .
      dockerfile: api/Dockerfile
    env_file: .env
    volumes:
      - db_data:/data
      - uploads:/uploads
    environment:
      - UPLOAD_DIR=/uploads
      - DATABASE_URL=sqlite:////data/coupontracker.db
    restart: unless-stopped

  frontend:
    build: ./frontend
    restart: unless-stopped

  nginx:
    build: ./nginx
    ports:
      - "8080:80"
    depends_on:
      - api
      - frontend
    restart: unless-stopped

volumes:
  db_data:
  uploads:
