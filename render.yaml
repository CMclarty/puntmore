# Render blueprint. Connect the repo once in the dashboard (New > Blueprint) and
# every push to main deploys.
#
# ONE service, not a static site plus an API. The frontend calls relative
# /api/... paths and the session cookie is same_site="lax", so both must come
# from one origin — api/Dockerfile builds the frontend into the API image and
# app/asgi.py serves it. Two services on two hostnames would break login
# silently rather than loudly.
#
# The disk pins this to a single instance. That is not a limitation to work
# around: SQLite has one writer, so a second instance would corrupt it.

services:
  - type: web
    name: puntmore
    runtime: docker
    region: frankfurt          # closest to UK — change if you are elsewhere
    plan: starter              # free has no persistent disk; the DB needs one
    dockerfilePath: ./api/Dockerfile
    dockerContext: .           # repo root: the build needs api/ AND frontend/
    # /ready, NOT /health: /health has no dependencies and answers 200 on a
    # process that cannot serve a single request, which is how a deploy with an
    # uninitialised database once went green. /ready checks that startup
    # actually happened, so a broken deploy fails to promote.
    healthCheckPath: /api/ready
    autoDeploy: true

    disk:
      name: puntmore-data
      mountPath: /data         # SQLite file and uploaded coupon images
      sizeGB: 1                # must be 1 or a multiple of 5

    envVars:
      - key: DATABASE_URL
        value: sqlite:////data/coupontracker.db
      - key: UPLOAD_DIR
        value: /data/uploads   # on the disk, or images vanish on redeploy

      # Cards/Corners is surfaced; it stays private via the split-auth grant
      # (only "*" users see it).
      #
      # AccaBonus: bet365 value against de-vigged Pinnacle, on the Acca Boost's
      # eligible sports. It costs 1 credit per sport key per cache cycle, and
      # ACCABONUS_CACHE_TTL is the dial that decides whether that is cheap or
      # not: at 24h it is ~450 credits/month, at 1h it is ~3.6k-10.8k depending
      # on how many keys discovery finds. Set to 1h for testing — watch the
      # "accabonus pull" log line for the key count and cut ACCABONUS_SPORT_KEYS
      # to a short list if it runs hot.
      - key: ENABLE_ACCABONUS
        value: "true"
      - key: ACCABONUS_CACHE_TTL
        value: "3600"
      # Pin to a short comma-separated list (e.g. "tennis_atp") to cap the burn
      # while testing. Empty = discover every eligible key.
      - key: ACCABONUS_SPORT_KEYS
        value: ""
      - key: ENABLE_CARDS
        value: "true"

      # Secrets: sync:false means Render prompts once at first deploy and stores
      # the value itself. Never commit these.
      - key: SECRET_KEY
        generateValue: true    # random, then stable — sessions survive deploys
      - key: AUTH_USERS
        sync: false
      - key: BETTINGISCOOL_API_KEY
        sync: false
      # Cards/Corners: Paddy Power's price comes from TheOddsApi. Without this
      # the cards client is None and the feed is empty — which is the state the
      # tool was in for its whole life, so the absence is easy to miss.
      #
      # Billed per event as (markets x regions). Adding this key turns the
      # sweep on immediately, so read Settings.cards_daily_call_budget below
      # before setting it.
      - key: ODDS_API_KEY
        sync: false

      # Hard ceiling on per-event cards calls in one UTC day. The true credit
      # cost of a call is not yet measured (see docs/provider-verification.md),
      # so this stops a sweep rather than letting it discover the rate when the
      # month's quota is gone. Raise it once `x-requests-last` has been read off
      # a real call — it is here rather than in code so that is a dashboard
      # edit, not a redeploy.
      - key: CARDS_DAILY_CALL_BUDGET
        value: "650"
      - key: ANTHROPIC_API_KEY
        sync: false
      - key: STATE_API_KEY
        generateValue: true
      - key: DISCORD_WEBHOOK_URL
        sync: false
