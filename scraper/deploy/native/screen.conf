# sway config for puntmore-screen.service: the Scraper's own virtual screen.
# One 1920x1080 output on the box's GPU, with its own Xwayland for Chrome
# (browser.py starts Chrome on X11). Measured 11 Nov 2026: Chrome there sees
# screen 1920x1080, dpr 1 and the Radeon's WebGL, and Callum's desktop never moves.
output HEADLESS-1 resolution 1920x1080 position 0 0
xwayland enable
default_border none
focus_follows_mouse no

# The Xwayland display, for puntmore-scraper.service (its EnvironmentFile).
exec sh -c 'printf "DISPLAY=%s\n" "$DISPLAY" > "$XDG_RUNTIME_DIR/puntmore-screen.env"'
# The viewer: this machine only. It has no password, so never another address.
exec wayvnc 127.0.0.1 5910
